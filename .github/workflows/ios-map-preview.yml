# TEMPORARY DIAGNOSTIC BRANCH ONLY. Never merge this replacement into main/PR11.
# The required full187 reliability and map workflows remain unchanged on their source branches.
name: iOS capture diagnostic ONLY (no reliability signoff)
run-name: Capture-only diagnostic for reviewed 25df app
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed app source (25df only); tooling comes from the dispatch branch
        required: true
        type: string
        default: 25df39cbd1effdef3807b58ba3403687a752587b
permissions:
  contents: read
concurrency:
  group: gta-native-capture-diagnostic-only
  cancel-in-progress: false
jobs:
  capture-diagnostic-only:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.visibility == 'public' && github.repository == 'rupayon123/gta-free-stem-ios'
    runs-on: macos-26
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Check out diagnostic tooling (temporary branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-tooling
          persist-credentials: false
      - name: Validate exact diagnostic target
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = '25df39cbd1effdef3807b58ba3403687a752587b'
          echo 'DIAGNOSTIC ONLY: no reliability tests or release signoff.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the unchanged reviewed app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_source_sha }}
          path: reviewed-app
          persist-credentials: false
      - name: Verify source, pins and exact compiler
        working-directory: reviewed-app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          shasum -a 256 -c .github/native-ci-source.sha256
          xcodebuild -version > "$RUNNER_TEMP/diagnostic-xcode.txt"
          cat "$RUNNER_TEMP/diagnostic-xcode.txt"
          grep -Fx 'Xcode 26.6' "$RUNNER_TEMP/diagnostic-xcode.txt"
          grep -Fx 'Build version 17F113' "$RUNNER_TEMP/diagnostic-xcode.txt"
      - name: Build exact source without executing XCTest
        working-directory: reviewed-app
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! xcodebuild build -project GTAFreeSTEM.xcodeproj -scheme GTAFreeSTEM -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/GTA-diagnostic-derived" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            GTA_RELEASE_SOURCE_COMMIT="$EXPECTED_SOURCE_SHA" > "$RUNNER_TEMP/diagnostic-build.log" 2>&1; then
            tail -80 "$RUNNER_TEMP/diagnostic-build.log"
            exit 1
          fi
          tail -8 "$RUNNER_TEMP/diagnostic-build.log"
      - name: Diagnose headless surfaces, GUI attachment and reviewed Home
        timeout-minutes: 6
        env:
          APP_SOURCE_ROOT: ${{ github.workspace }}/reviewed-app
        run: python3 diagnostic-tooling/.github/scripts/diagnose-native-capture.py
      # No cache, uploads, new services, extra permission prompts or private artifacts.
      # Only ordinary diagnostic logs and the bounded real native preview persist.
