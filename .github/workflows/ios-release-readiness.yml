name: Focused iOS beta navigation diagnostic
on:
  push:
    branches: [codex/ios-beta-nav-20261109]
    paths: [.github/workflows/ios-release-readiness.yml]
permissions:
  contents: write
jobs:
  navigation:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and choose one available iPhone simulator
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 098f5f6feacfeaa8bcee73ba7481b396a6cb2132
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/ios-release-readiness.yml
          test -z "$(git status --porcelain)"
          shasum -a 256 -c .github/native-ci-source.sha256
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'devices.json').read_text())['devices']
          candidates = []
          for runtime, entries in devices.items():
              match = re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+)-(\d+)', runtime)
              if not match: continue
              for entry in entries:
                  if entry.get('isAvailable') and entry.get('name') == 'iPhone 17 Pro':
                      candidates.append((tuple(map(int, match.groups())), entry['udid'], runtime))
          if not candidates: raise SystemExit('No available iPhone 17 Pro simulator; no silent device substitution')
          _, device, runtime = max(candidates)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=platform=iOS Simulator,id=' + device + '\n')
          print('Selected iPhone 17 Pro', runtime, device)
          PY
      - name: Run iOS unit regressions
        id: units
        timeout-minutes: 20
        shell: bash
        env:
          TEST_DESTINATION: ${{ steps.destination.outputs.value }}
        run: |
          set -euo pipefail
          xcodebuild test -project GTAFreeSTEM.xcodeproj -scheme GTAFreeSTEM \
            -configuration Debug -destination "$TEST_DESTINATION" -destination-timeout 90 \
            -jobs 1 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath "$RUNNER_TEMP/nav-derived" -resultBundlePath "$RUNNER_TEMP/units.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/units.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/units.xcresult" > "$RUNNER_TEMP/units-summary.json"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/units.xcresult" > "$RUNNER_TEMP/units-tests.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          summary = json.loads((root / 'units-summary.json').read_text())
          print(json.dumps(summary))
          total = summary.get('totalTestCount', 0)
          if summary.get('result') != 'Passed' or total < 200 or summary.get('passedTests') != total or summary.get('failedTests') != 0 or summary.get('skippedTests') != 0:
              raise SystemExit('The complete unit suite did not pass')
          tests = (root / 'units-tests.json').read_text()
          for name in ('testSourceAccessibilityNotesSurviveFeedCacheArchiveAndTranslationMerge', 'testFullDescriptionBindingRequiresExactIdentityLocaleAndSourceBytes', 'testOnDeviceListingCacheBindsExactSourceAndBoundsMemory', 'testDailyReminderIsOptInAndOnlyPersistsAcceptedSchedules', 'testSavedFilterAlertsMatchIndependentlyRetryAndDeduplicateAcrossRelaunch', 'testStructuredSupportV1AndUnavailableMarkerSurviveFeedCacheArchiveAndCopies', 'testReviewedFactualSourcesRequireExactRecordsAndNeverAssertPermission', 'testLargeCatalogueCacheEncodingKeepsUIResponsiveAndHonorsCancellation', 'testCancelledRefreshDuringCachePreparationRetainsResultsAndSavedRecords'):
              if name not in tests: raise SystemExit('Missing required regression: ' + name)
          PY
      - name: Verify the installed build 19 reader against v1
        timeout-minutes: 18
        shell: bash
        env:
          TEST_DESTINATION: ${{ steps.destination.outputs.value }}
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=1 origin ee6edf3b9852db149390c38a18c48023f5a3f509
          git worktree add -q --detach "$RUNNER_TEMP/build19-reader" ee6edf3b9852db149390c38a18c48023f5a3f509
          curl -fsSL --max-time 30 'https://raw.githubusercontent.com/rupayon123/gta-free-stem-opportunities/refs/heads/codex/hunter-dual-review-20261110-42773144005/opportunities.json' -o "$RUNNER_TEMP/build19-reader/GTAFreeSTEM/Resources/opportunities.json"
          printf '%s  %s\n' 'a7acceb3d12d38989eb3083a369b570d178277d5046ee0311a04acc1473ec4ae' "$RUNNER_TEMP/build19-reader/GTAFreeSTEM/Resources/opportunities.json" | shasum -a 256 -c -
          xcodebuild test -project "$RUNNER_TEMP/build19-reader/GTAFreeSTEM.xcodeproj" -scheme GTAFreeSTEM \
            -configuration Debug -destination "$TEST_DESTINATION" -destination-timeout 90 \
            -jobs 1 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:GTAFreeSTEMTests/APIClientTests/testBundledSnapshotCarriesReleaseReadyContentRightsManifest \
            -derivedDataPath "$RUNNER_TEMP/legacy-derived" -resultBundlePath "$RUNNER_TEMP/legacy.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/legacy.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/legacy.xcresult" > "$RUNNER_TEMP/legacy-summary.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary=json.loads((Path(os.environ['RUNNER_TEMP']) / 'legacy-summary.json').read_text())
          print('BUILD19_READER_SUMMARY ' + json.dumps(summary))
          if summary.get('result') != 'Passed' or summary.get('totalTestCount') != 1 or summary.get('passedTests') != 1 or summary.get('failedTests') != 0 or summary.get('skippedTests') != 0:
              raise SystemExit('Build 19 reader did not accept the v1 candidate')
          PY
      - name: Run bottom-content diagnostic
        id: ui
        timeout-minutes: 22
        shell: bash
        env:
          TEST_DESTINATION: ${{ steps.destination.outputs.value }}
        run: |
          set -euo pipefail
          xcodebuild test -project GTAFreeSTEM.xcodeproj -scheme GTAHighSchoolUIQA \
            -configuration Debug -destination "$TEST_DESTINATION" -destination-timeout 90 \
            -jobs 1 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:GTAFreeSTEMUITests/HighSchoolJourneys/test10BottomContentRemainsAboveNavigation \
            -only-testing:GTAFreeSTEMUITests/HighSchoolJourneys/test11SampleAccessibilityNotesInLightAndDarkRTL \
            -only-testing:GTAFreeSTEMUITests/HighSchoolJourneys/test12AlertPreferencesOpenWithoutPermissionPromptInLightAndDarkRTL \
            -only-testing:GTAFreeSTEMUITests/HighSchoolJourneys/test13SupportFilterUpdatesResultsSavesAndRestoresWithoutLeavingBrowse \
            -derivedDataPath "$RUNNER_TEMP/nav-derived" -resultBundlePath "$RUNNER_TEMP/nav.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/nav.log"
      - name: Export bounded simulator evidence
        if: always() && steps.ui.outcome != 'skipped'
        timeout-minutes: 4
        shell: bash
        env:
          EVIDENCE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/nav.xcresult"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/nav.xcresult" | tee "$RUNNER_TEMP/nav-summary.json"
          mkdir -p "$RUNNER_TEMP/nav-attachments"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/nav.xcresult" --output-path "$RUNNER_TEMP/nav-attachments"
          python3 - <<'PY'
          import base64, hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          root = temp / 'nav-attachments'
          manifest = root / 'manifest.json'
          if not manifest.exists(): raise SystemExit('No attachment manifest')
          records = json.loads(manifest.read_text())
          chosen = []
          for test in records:
              for attachment in test.get('attachments', []):
                  name = attachment.get('suggestedHumanReadableName', '')
                  filename = attachment.get('exportedFileName', '')
                  if (name.startswith(('bottom-', 'notes-', 'alerts-', 'support-', 'unreachable-control')) or attachment.get('isAssociatedWithFailure')) and filename.lower().endswith('.png'):
                      if Path(filename).name != filename: raise SystemExit('Unsafe attachment filename')
                      chosen.append((name, root / filename))
          expected = ['bottom-home', 'bottom-browse', 'bottom-detail', 'bottom-school', 'bottom-notebook', 'bottom-support', 'bottom-account', 'notes-light-content', 'notes-light-heading', 'notes-dark-large-rtl-content', 'notes-dark-large-rtl-heading', 'alerts-light', 'alerts-dark-large-rtl', 'support-filter-light', 'support-detail-light']
          summary = json.loads((temp / 'nav-summary.json').read_text())
          passed = summary.get('result') == 'Passed' and summary.get('totalTestCount') == 4 and summary.get('passedTests') == 4 and summary.get('failedTests') == 0 and summary.get('skippedTests') == 0
          if not passed:
              # Preserve one bounded failure image in the log; never publish a
              # passing-evidence branch for a failed or incomplete test run.
              failure = next(((name, path) for name, path in chosen if 'unreachable' in name.lower()), None)
              if failure is not None:
                  raw = failure[1].read_bytes()
                  if len(raw) <= 4_000_000:
                      print('NAV_FAILURE_META ' + json.dumps({'name': failure[0], 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw)}))
                      encoded = base64.b64encode(raw).decode()
                      for offset in range(0, len(encoded), 120): print('NAV_FAILURE_DATA ' + encoded[offset:offset+120])
              raise SystemExit('The exact four-test UI diagnostic did not pass')
          selected = []
          for key in expected:
              match = next(((name, path) for name, path in chosen if name.startswith(key)), None)
              if match is None: raise SystemExit('Passing diagnostic is missing ' + key)
              selected.append((key, match[1]))
          evidence = temp / 'gta-evidence'
          evidence.mkdir(mode=0o700)
          entries = []
          total = 0
          for key, path in selected:
              raw = path.read_bytes(); total += len(raw)
              if len(raw) > 4_000_000 or total > 16_000_000: raise SystemExit('Original PNG evidence exceeds limit')
              filename = key + '.png'
              (evidence / filename).write_bytes(raw)
              entries.append({'file': filename, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          run_id = os.environ['GITHUB_RUN_ID']; attempt = os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch(r'\d+', run_id) or not re.fullmatch(r'\d+', attempt): raise SystemExit('Invalid run ID')
          ref = 'codex/ios-beta-evidence-' + run_id + '-' + attempt
          (evidence / 'manifest.json').write_text(json.dumps({'workflowCommit': os.environ['GITHUB_SHA'], 'sourceCommit': '098f5f6feacfeaa8bcee73ba7481b396a6cb2132', 'simulatorOnly': True, 'images': entries}, indent=2) + '\n')
          askpass = temp / 'gta-evidence-askpass.sh'
          askpass.write_text('#!/bin/sh\ncase "$1" in *Username*) printf "%s\\n" x-access-token ;; *) printf "%s\\n" "$EVIDENCE_GITHUB_TOKEN" ;; esac\n')
          askpass.chmod(0o700)
          env = os.environ.copy(); env['GIT_ASKPASS'] = str(askpass); env['GIT_TERMINAL_PROMPT'] = '0'
          def git(*args): subprocess.run(['git', '-C', str(evidence), *args], check=True, env=env)
          git('init', '-q'); git('config', 'user.name', 'github-actions[bot]'); git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', 'manifest.json', *[entry['file'] for entry in entries]); git('commit', '-qm', 'Record simulator review evidence')
          remote = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '.git'
          probe = subprocess.run(['git', 'ls-remote', '--exit-code', remote, 'refs/heads/' + ref], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if probe.returncode != 2: raise SystemExit('Evidence ref exists or its absence could not be verified')
          git('push', '-q', remote, 'HEAD:refs/heads/' + ref)
          askpass.unlink(missing_ok=True)
          print('EVIDENCE_REF ' + ref)
          print('EVIDENCE_MANIFEST ' + json.dumps(entries))
          PY
