name: Frozen iOS normal Browse capture only
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Previously tested frozen app commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ios-frozen-normal-browse-qa
  cancel-in-progress: false
jobs:
  normal-browse:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-26
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CANDIDATE_SOURCE_SHA: a6b1a54deeefe1dfbb0aa28cda444e45dd605153
      QA_COMMIT: ${{ github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Check out the exact previously tested app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a6b1a54deeefe1dfbb0aa28cda444e45dd605153
          path: app
          persist-credentials: false
      - name: Check out this isolated QA script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: qa
          persist-credentials: false
      - name: Verify app source and existing source hashes
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = "$CANDIDATE_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          shasum -a 256 -c .github/native-ci-source.sha256
          xcodebuild -version
          test -d "$DEVELOPER_DIR"
      - name: Select the reviewed simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          inventory=json.loads((Path(os.environ['RUNNER_TEMP'])/'devices.json').read_text())['devices']
          matches=[d for d in inventory.get('com.apple.CoreSimulator.SimRuntime.iOS-26-5', [])
                   if d.get('name')=='iPhone 17 Pro' and d.get('isAvailable') is True]
          assert len(matches)==1, 'Required simulator absent or ambiguous'
          destination='platform=iOS Simulator,id='+matches[0]['udid']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('destination='+destination+'\n')
          print(destination)
          PY
      - name: Compile the unchanged app without repeating unit tests
        env:
          TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -euo pipefail
          xcodebuild build -project GTAFreeSTEM.xcodeproj -scheme GTAFreeSTEM \
            -configuration Debug -destination "$TEST_DESTINATION" -destination-timeout 60 \
            -derivedDataPath "$RUNNER_TEMP/GTAFreeSTEM-derived-data" -jobs 2 \
            CODE_SIGNING_ALLOWED=NO GTA_RELEASE_SOURCE_COMMIT="$CANDIDATE_SOURCE_SHA"
      - name: Capture actual normal Browse after bounded loading waits
        timeout-minutes: 8
        env:
          TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: python3 "$GITHUB_WORKSPACE/qa/.github/scripts/capture-normal-browse.py"
      # Ordinary logs only: no cache/artifact upload, new secret, paid runner or app mutation.
