name: GTAFreeSTEM
options:
  bundleIdPrefix: com.rupayonhaldar
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: "NO"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_VERSION: "6.0"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "17"
    GTA_RELEASE_SOURCE_COMMIT: UNSET
  configs:
    Debug:
      ENABLE_TESTABILITY: "YES"
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: "YES"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      ENABLE_NS_ASSERTIONS: "NO"
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  GTAFreeSTEM:
    type: application
    platform: iOS
    sources:
      - path: GTAFreeSTEM
        excludes:
          - MacCatalyst-Info.plist
          - MacCatalyst.entitlements
    resources:
      - GTAFreeSTEM/Assets.xcassets
      - GTAFreeSTEM/Resources
    info:
      path: GTAFreeSTEM/Info.plist
      properties:
        UIAppFonts:
          - Nunito.ttf
        CFBundleDisplayName: GTA FREE STEM
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GTAReleaseSourceCommit: "$(GTA_RELEASE_SOURCE_COMMIT)"
        CFBundleURLTypes:
          - CFBundleURLName: com.rupayonhaldar.gtafreestem
            CFBundleURLSchemes:
              - gtafreestem
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.rupayonhaldar.gtafreestem.hunt.refresh
        NSLocationWhenInUseUsageDescription: GTA FREE STEM can use your location only while browsing to find nearby free opportunities.
        UIBackgroundModes:
          - fetch
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: GTAFreeSTEM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.rupayonhaldar.gtafreestem
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]": com.rupayonhaldar.gtafreestem.maccatalyst
        "INFOPLIST_FILE[sdk=macosx*]": GTAFreeSTEM/MacCatalyst-Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": GTAFreeSTEM/MacCatalyst.entitlements
        "ENABLE_APP_SANDBOX[sdk=macosx*]": "YES"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FE33NM88XX
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
    dependencies:
      - target: GTAFreeSTEMWatch
        destinationFilters: [iOS]
  GTAFreeSTEMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GTAFreeSTEMTests
    postBuildScripts:
      - name: Stage source contract fixtures
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          fixture_root="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SourceFixtures"
          case "${fixture_root}" in
            "${TARGET_BUILD_DIR}"/*/SourceFixtures) ;;
            *) echo "Refusing unsafe source-fixture path: ${fixture_root}" >&2; exit 1 ;;
          esac
          /bin/rm -rf "${fixture_root}"
          /bin/mkdir -p "${fixture_root}/GTAFreeSTEM.xcodeproj"
          /usr/bin/ditto "${SRCROOT}/GTAFreeSTEM" "${fixture_root}/GTAFreeSTEM"
          /usr/bin/ditto "${SRCROOT}/GTAFreeSTEMWatch" "${fixture_root}/GTAFreeSTEMWatch"
          /bin/cp "${SRCROOT}/project.yml" "${fixture_root}/project.yml"
          /bin/cp "${SRCROOT}/GTAFreeSTEM.xcodeproj/project.pbxproj" "${fixture_root}/GTAFreeSTEM.xcodeproj/project.pbxproj"
          /usr/bin/touch "${fixture_root}/.complete"
        inputFiles:
          - "$(SRCROOT)/GTAFreeSTEM"
          - "$(SRCROOT)/GTAFreeSTEMWatch"
          - "$(SRCROOT)/project.yml"
          - "$(SRCROOT)/GTAFreeSTEM.xcodeproj/project.pbxproj"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SourceFixtures"
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FE33NM88XX
        # This fixed script only copies declared project inputs into the test
        # bundle; disabling script sandboxing here avoids nested-output denial.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        PRODUCT_NAME: GTAFreeSTEMTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GTAFreeSTEM.app/GTAFreeSTEM"
    info:
      path: GTAFreeSTEMTests/Info.plist
      properties:
        CFBundleDisplayName: GTA FREE STEM Tests
    dependencies:
      - target: GTAFreeSTEM
  GTAFreeSTEMWatch:
    type: application
    platform: watchOS
    sources:
      - GTAFreeSTEMWatch
      - GTAFreeSTEMWatch/Assets.xcassets
      - GTAFreeSTEMWatch/PrivacyInfo.xcprivacy
    resources:
      - GTAFreeSTEMWatch/WatchStrings.json
    info:
      path: GTAFreeSTEMWatch/Info.plist
      properties:
        CFBundleDisplayName: GTA FREE STEM
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GTAReleaseSourceCommit: "$(GTA_RELEASE_SOURCE_COMMIT)"
        WKCompanionAppBundleIdentifier: com.rupayonhaldar.gtafreestem
        WKApplication: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: GTAFreeSTEMWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.rupayonhaldar.gtafreestem.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FE33NM88XX
schemes:
  GTAFreeSTEM:
    build:
      targets:
        GTAFreeSTEM: all
    run:
      config: Debug
    test:
      config: Debug
      debugEnabled: false
      targets:
        - GTAFreeSTEMTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  GTAFreeSTEM Watch:
    build:
      targets:
        GTAFreeSTEM: all
        GTAFreeSTEMWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
